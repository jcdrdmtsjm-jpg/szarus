<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Szaruś szuka rodziny</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#87d4f5;touch-action:none;user-select:none;-webkit-user-select:none;font-family:Arial,sans-serif}canvas{display:block}</style>
</head><body><canvas id="c"></canvas><script>
"use strict";
// ===== USTAWIENIA =====
const cv=document.getElementById("c"),g=cv.getContext("2d");
const VW=960,VH=540,GY=440;            // wirtualny ekran i poziom ziemi
const BX=180;                           // stałe miejsce Szarusia na ekranie
const CEIL=175;                         // w norce Szaruś nie skoczy wyżej (stopy)
// Plan poziomu: odcinki [rodzaj, długość w px]
//   g = łąka/ścieżka, t = podziemny korytarz, d = droga po drzewach, k = droga po krzaczkach
const LEVELS=[
 {name:"Poranna łąka",sky:["#8fd8ff","#e8fbff"],hill:"#7fd36b",spd:220,obs:["fence","rock"],plan:[["g",13000]]},
 {name:"Zielony las",sky:["#7cc9e8","#dff7e8"],hill:"#4fb35a",spd:228,obs:["fence","rock","water","log"],plan:[["g",14000]]},
 {name:"Podziemny korytarz",sky:["#9fdcff","#f0fff0"],hill:"#6cc760",spd:234,obs:["fence","rock","water","log"],cave:0,plan:[["g",3500],["t",4500],["g",2600],["t",2600],["g",2300]]},
 {name:"Ogród kwiatów",sky:["#ffc4e1","#fff3f9"],hill:"#8ad46a",spd:242,obs:["fence","water","log","hedgehog"],cave:0,plan:[["g",5500],["t",3200],["g",6300]]},
 {name:"Droga po drzewach",sky:["#86d0f0","#e6fff0"],hill:"#58b85a",spd:248,obs:["fence","rock","log","hedgehog"],plan:[["g",3000],["d",4500],["g",3000],["d",3600],["g",2300]]},
 {name:"Krzaczki i jeżyny",sky:["#a6e3ff","#fff8e0"],hill:"#7cc95c",spd:254,obs:["fence","water","hedgehog","rock"],berries:1,plan:[["g",2600],["k",4500],["g",2600],["k",4000],["g",2500]]},
 {name:"Kryształowa jaskinia",sky:["#b9c8ff","#f3eaff"],hill:"#6fbf7a",spd:260,obs:["fence","rock","log"],cave:1,berries:1,plan:[["g",2600],["t",12500],["g",2400]]},
 {name:"Zachód słońca",sky:["#ff9a6b","#ffe0a8"],hill:"#6fb85a",spd:268,obs:["fence","water","rock","hedgehog","bee"],cave:0,berries:1,plan:[["g",3000],["d",3000],["g",2800],["t",3500],["g",2800],["k",2800],["g",2300]]},
 {name:"Nocny las",sky:["#1f2a5c","#4b5a9a"],hill:"#2f6e4a",night:1,spd:276,obs:["fence","water","log","hedgehog","bee"],cave:2,berries:1,plan:[["g",2600],["t",4000],["g",2300],["d",4500],["g",2300],["t",3000],["g",2300]]},
 {name:"Wieczór pod domem",sky:["#2d3a7a","#8a7ac9"],hill:"#3f8a55",night:1,spd:284,obs:["fence","water","log","hedgehog","bee"],cave:2,berries:1,plan:[["g",3000],["k",3000],["g",2600],["t",3500],["g",2600],["d",3500],["g",3000]]}];
// Kolory norek: zwykła ziemia, kryształowa jaskinia, nocna norka
const CAVES=[{bg:["#4a3020","#6b4a2e"],wall:"#2e1d10",floor:"#5a3a22",path:"#7a5636",glow:"#ffd36b"},
 {bg:["#2a1d4a","#4c3a78"],wall:"#1a1030",floor:"#3a2a5a",path:"#55427e",glow:"#d59bff"},
 {bg:["#16233f","#2c3d62"],wall:"#0c1426",floor:"#24314f",path:"#34466c",glow:"#7fe3ff"}];
const SIZES={fence:[50,55],rock:[55,40],water:[110,20],log:[80,38],hedgehog:[55,35],bee:[45,35],
 stone:[55,40],root:[80,36],puddle:[110,20],mole:[62,34],crystal:[46,52]};
const FOODS=[["carrot",10],["salad",15],["cucumber",15],["strawberry",20],["apple",20]];
// Rodzinka: na mecie poziomu N czeka N królików
const FAMILY=[{c:"#b9b9c4",s:1,acc:"bow",v:"mamo"},{c:"#8f8f9c",s:1.05,v:"tato"},{c:"#d8d0c8",s:.72,acc:"bow",v:"siostrzyczko"},
 {c:"#a89a90",s:.72,v:"braciszku"},{c:"#ffffff",s:.86,acc:"glasses",v:"babciu"},{c:"#7d7d88",s:.9,acc:"glasses",v:"dziadku"},
 {c:"#c9b8a8",s:.86,acc:"bow",v:"ciociu"},{c:"#9fa7b5",s:.9,v:"wujku"},{c:"#eadfd2",s:.66,acc:"bow",v:"kuzynko"},{c:"#b0a090",s:.66,v:"kuzynie"}];
const NL=LEVELS.length,BELLY=10;      // BELLY: tyle smakołyków i... bobki!

// ===== ZAPIS POSTĘPU =====
// Nowy klucz "szarus10"; stary zapis "szarus" (5 poziomów) jest przenoszony automatycznie
const SKEY="szarus10";
let save={unlocked:1,best:Array(NL).fill(0),mute:false};
try{const raw=localStorage.getItem(SKEY)||localStorage.getItem("szarus");
 if(raw){const o=JSON.parse(raw)||{};
  if(o.unlocked)save.unlocked=Math.max(1,Math.min(NL,o.unlocked|0));
  if(Array.isArray(o.best))o.best.forEach((b,i)=>{if(i<NL)save.best[i]=+b||0;});
  save.mute=!!o.mute;}}catch(e){}
function store(){try{localStorage.setItem(SKEY,JSON.stringify(save))}catch(e){}}

// ===== SKALOWANIE EKRANU =====
let sc=1,ox=0,oy=0;
function resize(){const d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;
 cv.width=w*d;cv.height=h*d;cv.style.width=w+"px";cv.style.height=h+"px";
 sc=Math.min(w/VW,h/VH);ox=(w-VW*sc)/2;oy=(h-VH*sc)/2;g.setTransform(d*sc,0,0,d*sc,d*ox,d*oy);}
addEventListener("resize",resize);resize();

// ===== DŹWIĘK I MUZYKA (Web Audio) =====
let ac=null,nextNote=0,step=0;
// iPhone: dźwięk odblokowuje się dopiero po dotyku; próbujemy też ominąć przełącznik trybu cichego
let unlocked=false;
function audio(){
 try{if(navigator.audioSession)navigator.audioSession.type="playback";}catch(e){}
 if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A();}
 if(!ac)return;
 if(ac.state!=="running")ac.resume();
 if(!unlocked){unlocked=true;
  const b=ac.createBuffer(1,1,22050),src=ac.createBufferSource();src.buffer=b;src.connect(ac.destination);src.start(0);
  // cichy element <audio> — na iOS przełącza dźwięk na kanał "media", więc gra nawet w trybie cichym
  try{const el=document.createElement("audio");el.setAttribute("playsinline","");
   el.src="data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YUAGAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA";el.play().catch(()=>{});}catch(e){}}}
["touchend","pointerup","click","keydown"].forEach(ev=>addEventListener(ev,audio,{passive:true}));
function tone(f,d,type,v,when){if(!ac||save.mute)return;const t=when||ac.currentTime,o=ac.createOscillator(),k=ac.createGain();
 o.type=type||"square";o.frequency.value=f;k.gain.setValueAtTime(v||.05,t);k.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(k);k.connect(ac.destination);o.start(t);o.stop(t+d+.02);}
// ===== EFEKTY DŹWIĘKOWE =====
const now=()=>ac?ac.currentTime:0;
function slide(f1,f2,d,type,v,when){if(!ac||save.mute)return;const t0=when||now(),o=ac.createOscillator(),k=ac.createGain();
 o.type=type;o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(f2,t0+d);
 k.gain.setValueAtTime(v,t0);k.gain.exponentialRampToValueAtTime(.0001,t0+d+.03);o.connect(k);k.connect(ac.destination);o.start(t0);o.stop(t0+d+.05);}
const sJump=()=>slide(380,900,.15,"square",.12),
 sEat=()=>{tone(988,.08,"square",.12,now());tone(1319,.14,"square",.12,now()+.07);},          // "dzyń" za smakołyk
 sPoint=()=>{tone(660,.06,"triangle",.14,now());tone(880,.1,"triangle",.14,now()+.05);},     // przeskoczona przeszkoda
 sHit=()=>{tone(220,.15,"sawtooth",.14,now());tone(150,.3,"sawtooth",.14,now()+.12);},
 sPow=()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.16,"square",.11,now()+i*.07)),
 sWin=()=>[523,523,659,784,659,784,1047,1047].forEach((f,i)=>{tone(f,.22,"square",.1,now()+i*.14);tone(f/2,.22,"triangle",.12,now()+i*.14);}),
 sOver=()=>[392,330,262,196].forEach((f,i)=>tone(f,.3,"triangle",.14,now()+i*.22)),
 sClick=()=>tone(700,.06,"square",.08,now()),
 sPuff=()=>{[784,988,1175,1319,1568,1760,2093,2637].forEach((f,i)=>{tone(f,.12,"triangle",.11,now()+i*.045);tone(f*1.5,.08,"sine",.05,now()+i*.045+.02);});
  slide(300,1200,.35,"sine",.08,now()+.38);},                                                 // magiczne flipsy
 sPlop=()=>slide(420,90,.11,"sine",.2),                                                      // "plum!" bobek
 sFall=()=>slide(900,180,.45,"triangle",.13),                                                 // spadanie w dziurę
 sHole=()=>{slide(500,140,.3,"triangle",.1);tone(110,.25,"sine",.12,now()+.25);};            // wskok do norki
const MEL=[72,0,76,79,76,0,72,74,76,0,74,72,69,0,71,72, 72,0,76,79,81,79,76,74,72,74,76,74,72,0,0,0];
const BAS=[48,48,55,55,53,53,55,55];
function music(){if(!ac||save.mute||state!=="play"&&state!=="menu")return;
 const low=state==="play"&&inside;                // w norce muzyczka niżej, z echem
 while(nextNote<ac.currentTime+.2){if(nextNote<ac.currentTime)nextNote=ac.currentTime;
  const m=MEL[step%32];if(m){const f=440*Math.pow(2,(m-69-(low?12:0))/12);tone(f,.16,"triangle",.06,nextNote);if(low)tone(f,.14,"sine",.025,nextNote+.15);}
  if(step%4===0)tone(440*Math.pow(2,(BAS[(step/4)%8]-69)/12),.3,"triangle",.07,nextNote);
  nextNote+=.15;step++;}}

// ===== POMOCNICZE =====
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hh(i){const s=Math.sin(i*127.1+lvl*31.7)*43758.5453;return s-Math.floor(s);}   // stały "los" dla dekoracji

// ===== STAN GRY =====
let state="menu",lvl=0,dist=0,speed=0,score=0,lives=5,items=[],parts=[],texts=[],t=0,inside=false;
let bun,power={jump:0,run:0},hurt=0,winT=0,deco=[];
let secs=[],plats=[],hints=[],LEN=0;           // odcinki poziomu, platformy (gałęzie/krzaczki), podpowiedzi
let needSort=false,belly=0,poops=[],poopQ=0,poopT=0;          // brzuszek i bobki
const SZ={auto:false,god:false};               // haczyk do testów: autopilot / nieśmiertelność
window.SZ=SZ;

// ===== BUDOWANIE POZIOMU =====
function secAt(wx){for(const s of secs)if(wx>=s.a&&wx<s.b)return s;return wx<0?secs[0]:secs[secs.length-1];}
const isTunnel=wx=>secAt(wx).k==="t";
// wysokość podłoża w danym miejscu świata; null = dziura między gałęziami
function support(wx){const s=secAt(wx);if(s.k==="g"||s.k==="t")return GY;
 for(const p of plats)if(wx>=p.a-14&&wx<=p.b+14)return p.y;return null;}
function addFood(wx,y,n){let f=pick(FOODS);if(LEVELS[n].berries&&Math.random()<.25)f=["blackberry",20];
 items.push({kind:"food",type:f[0],pts:f[1],wx,y});}
function caveObs(n){const o=["stone","root","puddle"];if(n>=3)o.push("mole");if(LEVELS[n].cave===1)o.push("crystal","crystal");return o;}
function buildGround(s,n){const L=LEVELS[n],list=s.k==="t"?caveObs(n):L.obs;
 let wx=s.a+(s.a===0?800:480);const end=s.b-(s.b===LEN?1400:480);
 const gapMin=Math.max(360,560-n*22);
 while(wx<end){const type=pick(list),sz=SIZES[type];
  items.push({kind:"obs",type,wx,w:sz[0],h:sz[1],y:type==="bee"?GY-95:GY});
  const r=Math.random();
  if(r<.08)items.push({kind:"pow",type:pick(["life","jump","run"]),wx:wx+sz[0]/2,y:GY-190});
  else if(r<.8)for(let i=0;i<3;i++)addFood(wx-30+i*45+sz[0]/2,GY-110-Math.sin(i/2*Math.PI)*60,n);
  if(Math.random()<.6&&wx+260<s.b-300)addFood(wx+260,GY-35,n);
  wx+=gapMin+rnd(0,240);}}
function buildPlatforms(s,n){const bush=s.k==="k",top=bush?GY-100:GY-160,bot=bush?GY-35:GY-45;
 let x=s.a,y=GY-30,first=true;
 while(true){let b=x+(first?rnd(520,650):rnd(320,560));if(s.b-b<600)b=s.b;   // ostatnia sięga do końca odcinka
  plats.push({a:x,b,y,bush,seed:Math.floor(x)});
  for(let fx=x+(first?200:110);fx<b-70;fx+=rnd(120,180))
   if(Math.random()<.06)items.push({kind:"pow",type:pick(["life","jump","run"]),wx:fx,y:y-150});else addFood(fx,y-38,n);
  if(b>=s.b)break;
  const gap=rnd(66,100)+n*4;
  items.push({kind:"gap",wx:b,w:gap});
  const ny=clamp(y+rnd(-65,65),top,bot);
  for(let i=0;i<3;i++)addFood(b+gap/2+(i-1)*42,Math.min(y,ny)-85-(i===1?28:0),n);   // łuk marchewek nad dziurą
  x=b+gap;y=ny;first=false;}}
function build(n){const L=LEVELS[n];secs=[];plats=[];items=[];hints=[];let x=0;
 for(const[k,len]of L.plan){secs.push({k,a:x,b:x+len});x+=len;}LEN=x;
 for(const s of secs){if(s.k==="d"||s.k==="k")buildPlatforms(s,n);else buildGround(s,n);
  if(s.k!=="g")hints.push({wx:s.a-650,s:{t:"Do norki! Podziemny korytarz",d:"Skacz po gałęziach!",k:"Skacz po krzaczkach!"}[s.k]});}
 // złote torebki flipsów kukurydzianych co jakiś czas
 for(let wx=rnd(2200,2800);wx<LEN-2000;wx+=rnd(2600,3300)){
  const s=secAt(wx);if(s.k==="t"&&(wx-s.a<700||s.b-wx<900))continue;
  let p=wx;while(support(p)===null)p+=20;
  items.push({kind:"bag",wx:p+40,y:support(p)-125});}
 items.sort((a,b)=>a.wx-b.wx);}

function startLevel(n){lvl=n;build(n);dist=0;score=0;lives=5;parts=[];texts=[];power={jump:0,run:0};hurt=0;winT=0;
 belly=0;poops=[];poopQ=0;inside=false;
 bun={x:BX,y:GY,vy:0,ground:true,jumps:0,squash:0,coy:0};state="play";
 deco=[];for(let i=0;i<14;i++)deco.push({x:i*90+Math.random()*40,k:Math.random()<.5?"tree":"bush",s:.7+Math.random()*.6});}

// ===== STEROWANIE =====
function jump(){if(state!=="play")return;
 if(bun.ground||bun.coy>0){bun.vy=power.jump>0?-980:-780;bun.ground=false;bun.coy=0;bun.jumps=1;sJump();}
 else if(bun.jumps<2){bun.vy=(power.jump>0?-980:-780)*.85;bun.jumps=2;sJump();}}
let buttons=[];
function pointer(px,py){audio();const x=(px-ox)/sc,y=(py-oy)/sc;
 for(const b of buttons)if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){sClick();b.fn();return;}
 if(state==="play")jump();}
cv.addEventListener("touchstart",e=>{e.preventDefault();for(const tc of e.changedTouches)pointer(tc.clientX,tc.clientY);},{passive:false});
cv.addEventListener("mousedown",e=>pointer(e.clientX,e.clientY));
addEventListener("keydown",e=>{audio();if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();if(e.repeat)return;if(state==="play")jump();else if(buttons[0])buttons[0].fn();}
 if(e.code==="KeyP"&&(state==="play"||state==="pause"))state=state==="play"?"pause":"play";});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&state==="play")state="pause";});

// ===== FLIPSY I BOBKI =====
function cornBonus(it){score+=50;sPuff();texts.push({x:BX+it.wx-dist,y:it.y-20,s:"Flipsy! +50",l:1.4,c:"#ffd23f"});
 for(let i=0;i<30;i++)parts.push({x:BX+it.wx-dist,y:it.y,vx:(Math.random()-.5)*420,vy:-Math.random()*420,l:1,c:pick(["#ffd23f","#ffef9a","#ffb627","#fff"])});
 const bwx=dist+bun.x-BX;let base=GY;                       // deszcz chrupek przed Szarusiem
 for(let i=0;i<10;i++){const wx=bwx+170+i*46,s=support(wx);if(s!==null)base=s;
  items.push({kind:"food",type:"puff",pts:10,wx,y:base-70-Math.sin(i/9*Math.PI)*90});}
 needSort=true;}
function ate(){belly++;if(belly>=BELLY){belly=0;poopQ=4;poopT=.25;
 texts.push({x:bun.x-20,y:bun.y-130,s:"Ups! Bobki!",l:1.8,c:"#ffcf8a",big:1});score+=5;}}

// ===== SPADNIĘCIE W DZIURĘ =====
function fallen(){const bwx=dist+bun.x-BX;
 if(!SZ.god)lives--;hurt=1.6;sFall();
 const p=plats.find(p=>p.a>bwx-30);
 const target=p?p.a+60:bwx+200;dist=target-(bun.x-BX);
 for(const it of items)if(it.kind==="gap"&&it.wx<target)it.passed=true;
 bun.y=(p?p.y:GY)-170;bun.vy=0;bun.ground=false;bun.jumps=1;
 texts.push({x:bun.x+20,y:bun.y-30,s:"Hop! Jeszcze raz!",l:1.4});
 if(lives<=0){state="over";sOver();}}

// ===== AUTOPILOT (tylko do testów) =====
function autopilot(){const bwx=dist+bun.x-BX;
 if(bun.ground){for(const it of items){if(it.kind!=="obs"||it.type==="bee"||it.got||it.gone)continue;const d=it.wx-bwx;if(d>-5&&d<speed*.2+15){jump();return;}if(d>200)break;}
  if(support(bwx+40)===null||(support(bwx+70)??GY)<bun.y-45){jump();return;}}
 else if(bun.vy>150&&bun.jumps<2&&support(bwx)===null)jump();}

// ===== AKTUALIZACJA =====
function win(){state="win";winT=0;sWin();
 if(score>save.best[lvl])save.best[lvl]=score;if(lvl+2>save.unlocked)save.unlocked=Math.min(NL,lvl+2);store();
 for(let i=0;i<70;i++)parts.push({x:famX()-(lvl)*20,y:GY-120,vx:(Math.random()-.5)*520,vy:-Math.random()*520,l:2,c:`hsl(${Math.random()*360},90%,60%)`});}
const famX=()=>VW-80-Math.max(0,LEN-dist)-60;          // pierwszy (prawy) królik z rodzinki
function update(dt){if(SZ.freeze)return;t+=dt;music();
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.l-=dt;}parts=parts.filter(p=>p.l>0);
 for(const x of texts){x.y-=50*dt;x.l-=dt;}texts=texts.filter(x=>x.l>0);
 if(state==="win"){winT+=dt;return;}
 if(state!=="play")return;
 const L=LEVELS[lvl];
 speed=L.spd*Math.min(1,.6+dist/1500)*(power.run>0?1.5:1);
 if(dist<LEN){const mv=Math.min(speed*dt,LEN-dist);dist+=mv;for(const d of deco){d.x-=mv*.5;if(d.x<-100)d.x+=1260;}}
 else{bun.x+=200*dt;const stop=famX()-lvl*40-75;if(bun.x>=stop&&bun.ground){bun.x=stop;win();return;}}
 if(SZ.auto)autopilot();

 // --- fizyka Szarusia: grawitacja, lądowanie na ziemi i platformach
 let bwx=dist+bun.x-BX;const sup=support(bwx),prevY=bun.y,wasG=bun.ground;
 const wasIn=inside;inside=isTunnel(bwx);if(inside!==wasIn&&inside)sHole();
 bun.vy+=2000*dt;bun.y+=bun.vy*dt;
 if(inside&&bun.y<CEIL){bun.y=CEIL;if(bun.vy<0)bun.vy=0;}      // sufit norki
 bun.ground=false;
 if(sup!==null&&bun.vy>=0&&bun.y>=sup&&prevY<=sup+(wasG?48:30)){if(!wasG)bun.squash=.15;bun.y=sup;bun.vy=0;bun.ground=true;bun.jumps=0;}
 if(wasG&&!bun.ground&&bun.vy>=0)bun.coy=.13;else bun.coy=Math.max(0,bun.coy-dt);   // chwila na skok po zejściu z krawędzi

 if(bun.y>VH+60){fallen();if(state!=="play")return;bwx=dist+bun.x-BX;}
 // --- bobki wypadają po kolei
 if(poopQ>0){poopT-=dt;if(poopT<=0){poopT=.13;poopQ--;poops.push({wx:bwx-30,y:bun.y-16,vy:-60,r:6.5+Math.random()*1.5});sPlop();}}
 for(const p of poops)if(!p.rest){const py=p.y;p.vy+=1500*dt;p.y+=p.vy*dt;const s=support(p.wx);
  if(s!==null&&p.vy>0&&p.y>=s-p.r&&py<=s+12){p.y=s-p.r;p.rest=true;}}
 poops=poops.filter(p=>p.y<VH+50&&BX+p.wx-dist>-60);
 // --- przedmioty: przeszkody, dziury, jedzenie, moce, flipsy
 const bx=bun.x-22,bw=44,by=bun.y-48,bh=44;
 for(const it of items){if(it.got||it.gone)continue;const sx=BX+it.wx-dist;if(sx<-220||sx>VW+220)continue;
  if(it.kind==="obs"){
   if(it.type==="hedgehog")it.wx-=20*dt;
   const top=it.y-it.h,hx=sx+10,hw=it.w-20;
   let hit=bx<hx+hw&&bx+bw>hx&&by<it.y-4&&by+bh>top+6;
   if(it.type==="water"||it.type==="puddle")hit=bun.ground&&bun.x>sx+15&&bun.x<sx+it.w-15;
   if(hit&&!it.hit&&hurt<=0){it.hit=true;
    if(power.run>0){score+=5;texts.push({x:sx,y:top-10,s:"+5",l:1});it.gone=true;}
    else{if(!SZ.god)lives--;hurt=2;sHit();texts.push({x:bun.x,y:bun.y-80,s:"Auć!",l:1});
     if(it.type==="water"||it.type==="puddle"){bun.y=GY-1;bun.vy=-700;bun.ground=false;bun.jumps=1;}
     if(lives<=0){state="over";sOver();return;}}}
   if(!it.passed&&sx+it.w<bun.x){it.passed=true;if(!it.hit){score+=5;sPoint();texts.push({x:bun.x,y:bun.y-90,s:"+5",l:.8});}}
  }else if(it.kind==="gap"){
   if(!it.passed&&bwx>it.wx+it.w&&bun.ground){it.passed=true;score+=5;sPoint();texts.push({x:bun.x,y:bun.y-90,s:"+5",l:.8});}
  }else{const dx=sx-bun.x,dy=it.y-(bun.y-26),R=it.kind==="bag"?62:52;
   if(dx*dx+dy*dy<R*R){it.got=true;
    if(it.kind==="bag"){cornBonus(it);continue;}
    if(it.kind==="food"){score+=it.pts;sEat();texts.push({x:sx,y:it.y,s:"+"+it.pts,l:.8});ate();}
    else{sPow();if(it.type==="life"){lives=Math.min(9,lives+1);texts.push({x:sx,y:it.y,s:"+1 życie!",l:1.2});}
     if(it.type==="jump"){power.jump=8;texts.push({x:sx,y:it.y,s:"Super skok!",l:1.2});}
     if(it.type==="run"){power.run=6;texts.push({x:sx,y:it.y,s:"Super bieg!",l:1.2});}}
    for(let i=0;i<8;i++)parts.push({x:sx,y:it.y,vx:(Math.random()-.5)*200,vy:-Math.random()*200,l:.6,c:"#ffe14d"});}}}
 items=items.filter(it=>!it.got&&!it.gone&&BX+it.wx-dist>-250);
 if(needSort){items.sort((a,b)=>a.wx-b.wx);needSort=false;}
 if(power.run>0&&Math.random()<.6)parts.push({x:bun.x-25,y:bun.y-20,vx:-100,vy:-50,l:.5,c:`hsl(${t*400%360},90%,65%)`});}

function circ(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
function ell(x,y,rx,ry,c,rot){g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,7);g.fill();}
function rr(x,y,w,h,r,c){r=Math.min(r,w/2,h/2);g.fillStyle=c;g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.fill();}

 for(const d of deco){if(d.k==="tree"){rr(d.x-7*d.s,GY-80*d.s,14*d.s,80*d.s,5,"#8a5a33");circ(d.x,GY-95*d.s,40*d.s,"#3fae4f");circ(d.x-22*d.s,GY-78*d.s,26*d.s,"#4fc35a");circ(d.x+22*d.s,GY-80*d.s,26*d.s,"#38a048");circ(d.x+10*d.s,GY-105*d.s,5,"#ff5a5a");}
  else{circ(d.x,GY-12,22*d.s,"#45b84f");circ(d.x+20,GY-8,16*d.s,"#5cc964");circ(d.x+6,GY-24*d.s,4,"#ff7ac0");}}
 g.fillStyle="#6fcf4f";g.fillRect(-500,GY,VW+1000,VH);rr(-500,GY+18,VW+1000,34,10,"#e6c08a");
 const f2=dist%60;const FC=["#ff5a8a","#ffd23f","#b980ff","#ffffff","#ff8a3d"];
 for(let i=-1;i<18;i++){const fx=i*60-f2,k=Math.floor(dist/60);circ(fx,GY+8,5,FC[(i+k+5)%5]);circ(fx+30,GY+66,5,FC[(i+2+k+5)%5]);circ(fx,GY+8,2,"#ffcc00");}
 for(const s of secs){const xa=BX+s.a-dist,xb=BX+s.b-dist;if(xb<-80||xa>VW+80)continue;

// norka widziana z zewnątrz: wielki trawiasty pagórek z dziurą na wejściu i wyjściu
function hillOver(s,xa,xb){const L=LEVELS[lvl];xa-=40;xb+=40;           // dziura wypada dokładnie w miejscu wejścia
 const hp=()=>{g.beginPath();g.moveTo(xa-30,GY+2);g.bezierCurveTo(xa+10,GY-200,xa+60,GY-285,xa+200,GY-285);g.lineTo(xb-200,GY-285);

 hp();g.fillStyle="#8a5a35";g.fill();g.strokeStyle=L.hill;g.lineWidth=26;hp();g.stroke();
 g.fillStyle="rgba(0,0,0,.12)";for(let x=Math.max(xa+80,-40);x<Math.min(xb-80,VW+40);x+=90){const k=Math.floor((x-xa)/90);ell(x+hh(k)*30,GY-150+hh(k+4)*90,14,8,"rgba(0,0,0,.12)");}
 for(let x=Math.max(xa+60,-40);x<Math.min(xb-60,VW+40);x+=70){const k=Math.floor((x-xa)/70);circ(x,GY-275+hh(k)*8,5,["#ff5a8a","#ffd23f","#ffffff"][k%3]);}

// ===== RYSOWANIE: PODZIEMNY KORYTARZ =====
function caveScene(){const L=LEVELS[lvl],C=CAVES[L.cave||0];
 const gr=g.createLinearGradient(0,0,0,GY);gr.addColorStop(0,C.bg[0]);gr.addColorStop(1,C.bg[1]);g.fillStyle=gr;g.fillRect(-500,-500,VW+1000,VH+1000);
 const p1=dist*.3;                                            // tylna ściana: kamyki i korzonki
 for(let i=Math.floor(p1/120)-1;i<Math.floor(p1/120)+10;i++){const x=i*120-p1;ell(x+hh(i)*60,140+hh(i+5)*220,26+hh(i+9)*20,14+hh(i+3)*10,"rgba(0,0,0,.18)");}
 const p2=dist*.6;                                            // dekoracje: grzybki, kryształy, latarenki
 for(let i=Math.floor(p2/160)-1;i<Math.floor(p2/160)+8;i++){const x=i*160-p2+hh(i*3)*60,r=hh(i*7);
  if(r<.33){g.globalAlpha=.75;for(let k=0;k<3;k++){const mx=x+k*16,mh=14+k%2*10;rr(mx-3,GY-mh,6,mh,3,"#f2e6d0");const gl=.6+Math.sin(t*3+i+k)*.3;
    glow(mx,GY-mh,22,L.cave===1?"210,150,255":"120,255,200",gl*.45);ell(mx,GY-mh,11,7,L.cave===1?"#d59bff":"#7dffc8");circ(mx-3,GY-mh-2,2,"#fff");}g.globalAlpha=1;}
  else if(r<.6||L.cave===1){const gl=.5+Math.sin(t*2+i)*.25,cy=200+hh(i*5)*110;glow(x,cy+5,55,"170,200,255",gl*.5);g.globalAlpha=.6;   // kryształy w ścianie
   for(const[dx,dy,a,c]of[[-12,6,-.5,"#8fd6ff"],[0,0,0,"#c79bff"],[13,6,.5,"#ffb3e6"]]){g.save();g.translate(x+dx,cy+dy+20);g.rotate(a);g.fillStyle=c;g.beginPath();g.moveTo(-7,0);g.lineTo(0,-38);g.lineTo(7,0);g.fill();g.restore();}
   g.globalAlpha=1;}
  else{g.strokeStyle="#3a2414";g.lineWidth=2;g.beginPath();g.moveTo(x,50);g.lineTo(x,110);g.stroke();
   const gl=.6+Math.sin(t*4+i)*.25;glow(x,124,40,"255,210,100",gl*.55);rr(x-9,110,18,24,5,"#ffd36b");rr(x-11,106,22,6,3,"#5a3a22");}}
 // sufit z korzeniami
 g.fillStyle=C.wall;g.beginPath();g.moveTo(-500,-500);g.lineTo(VW+500,-500);
 for(let x=VW+40;x>=-40;x-=20){const w=Math.floor((x+dist)/20);g.lineTo(x,48+hh(w)*16);}g.fill();
 for(let i=Math.floor(dist/90);i<Math.floor(dist/90)+13;i++){const x=i*90-dist;g.strokeStyle="#7a4a26";g.lineWidth=3;g.beginPath();g.moveTo(x,55);
  g.quadraticCurveTo(x+10,70+hh(i)*10,x+4,78+hh(i+1)*22);g.stroke();
  if(hh(i+2)<.4){g.fillStyle=C.wall;g.beginPath();g.moveTo(x+30,55);g.lineTo(x+40,88);g.lineTo(x+50,55);g.fill();}}
 // podłoga
 g.fillStyle=C.floor;g.fillRect(-500,GY,VW+1000,VH);rr(-500,GY+18,VW+1000,34,10,C.path);
 for(let i=Math.floor(dist/70)-1;i<Math.floor(dist/70)+16;i++){const x=i*70-dist;ell(x,GY+8,7,4,"rgba(0,0,0,.25)");ell(x+35,GY+72,9,5,"rgba(255,255,255,.08)");}
 // światło na końcu (i na początku) tunelu
 {const s=secAt(dist+bun.x-BX),xa=BX+s.a-dist,xb=BX+s.b-dist;
  for(const[e0,e1,dir]of[[xb,VW+500,1],[-500,xa,-1]]){if(e1<e0||e0>VW+20||e1<-20)continue;const edge=dir>0?e0:e1;
   const lg=g.createLinearGradient(edge-dir*80,0,edge+dir*60,0);lg.addColorStop(0,"rgba(255,246,200,0)");lg.addColorStop(1,"rgba(255,246,200,1)");
   g.fillStyle=lg;g.fillRect(Math.min(edge-dir*80,edge+dir*60),0,140,VH);g.fillStyle="#fff6c8";g.fillRect(e0+(dir>0?60:0),0,e1-e0-60,VH);}}}

// ===== RYSOWANIE: RODZINA NA MECIE =====
function family(){const fx=VW-80-Math.max(0,LEN-dist);if(fx>VW+150)return;const n=lvl+1;
 g.fillStyle="#7a4a2a";g.beginPath();g.ellipse(fx+20,GY,90,70,0,Math.PI,0);g.fill();ell(fx+20,GY-5,40,35,"#3a2414");
 if(lvl===NL-1){                                              // dom Szarusia: okienko, drzwi i lampiony
  ell(fx+20,GY-5,40,35,"#c0773a");g.fillStyle="#9a5a2a";for(const dx of[-14,0,14])g.fillRect(fx+20+dx-1,GY-38,2,38);circ(fx+40,GY-18,4,"#ffd36b");
  circ(fx+70,GY-54,13,"#5a3418");circ(fx+70,GY-54,10,"#ffe9a0");g.fillStyle="#5a3418";g.fillRect(fx+69,GY-64,2,20);g.fillRect(fx+60,GY-55,20,2);

  for(let i=0;i<3;i++){const sy=(t*30+i*25)%75;circ(fx+58+Math.sin(t+i)*5,GY-98-sy,6+sy/10,`rgba(255,255,255,${.5-sy/160})`);}}
 for(let i=n-1;i>=0;i--){const F=FAMILY[i],hop=state==="win"?Math.abs(Math.sin(winT*8+i))*40:Math.abs(Math.sin(t*2+i))*4;

 const bf=poopQ>0?1:belly/BELLY;rr(20,98,130,22,11,"rgba(255,255,255,.75)");rr(22,100,Math.max(18,126*bf),18,9,bf>.75?"#ff9a3d":"#f5c26b");
 g.font="bold 13px Arial";g.textAlign="center";g.fillStyle="#7a4a26";g.fillText("brzuszek",85,114);
 // pasek drogi z kolorowymi odcinkami (norka, gałęzie, krzaczki)

 rr(330,22,Math.max(18,300*p),18,9,"rgba(126,217,87,.75)");circ(330+300*p,31,12,"#9a9aa6");txt("❤",645,40,24,"#ff4d6d","left");
 txt("Poziom "+(lvl+1),480,70,20,"#fff");
 if(power.jump>0)txt("Super skok "+Math.ceil(power.jump),940,90,20,"#bfe0ff","right");
 if(power.run>0)txt("Super bieg "+Math.ceil(power.run),940,115,20,"#ffe08a","right");
 button("II",880,14,60,50,"#8b5cf6",()=>{state="pause";});
 button(save.mute?"🔇":"🔊",810,14,60,50,"#8b5cf6",()=>{save.mute=!save.mute;store();});
 // podpowiedź przed nowym odcinkiem
 const bwx=dist+bun.x-BX;for(const h of hints)if(bwx>h.wx&&bwx<h.wx+700){const a=Math.min(1,(bwx-h.wx)/120,(h.wx+700-bwx)/120);g.globalAlpha=a;
  rr(250,150,460,56,28,"rgba(255,250,240,.92)");txt(h.s,480,188,28,"#ff7a3d");g.globalAlpha=1;}}
function panel(){g.fillStyle="rgba(0,0,0,.35)";g.fillRect(-500,-500,VW+1000,VH+1000);rr(180,70,600,400,36,"#fffaf0");}
function menu(){const kl=lvl,kd=dist;lvl=0;dist=0;
 if(!secs.length||secs[0].k!=="g")build(0);scene();lvl=kl;dist=kd;bunny(220,GY-Math.abs(Math.sin(t*4))*30,"me",1.6,false);

 button("GRAJ ▶",500,158,240,70,"#22c55e",()=>startLevel(Math.max(0,save.unlocked-1)));
 for(let i=0;i<NL;i++){const open=i<save.unlocked,col=i%5,row=Math.floor(i/5),bx=370+col*104,by=250+row*96;
  button(open?String(i+1):"🔒",bx,by,84,60,open?"#3b82f6":"#aaa",()=>{if(open)startLevel(i);});
  if(open&&save.best[i])txt("⭐"+save.best[i],bx+42,by+84,15,"#ff9a3d");}
 button("Od nowa",540,450,160,44,"#ef4444",()=>{if(confirm("Zacząć od nowa? Postęp zostanie usunięty.")){save.unlocked=1;save.best=Array(NL).fill(0);store();}});}

// ===== GŁÓWNA PĘTLA =====
function world(){const bwx=dist+bun.x-BX,ins=isTunnel(bwx);
 if(ins)caveScene();else{scene();family();}
 for(const it of items){const sx=BX+it.wx-dist;if(sx<-120||sx>VW+120||it.kind==="gap"||isTunnel(it.wx)!==ins)continue;
  if(it.kind==="obs")drawObs(it,sx);else if(it.kind==="food")drawFood(it,sx);else if(it.kind==="bag")drawBag(it,sx);else drawPow(it,sx);}
 for(const p of poops){const sx=BX+p.wx-dist;if(isTunnel(p.wx)===ins)drawPoop(p,sx);}
 if(!(hurt>0&&Math.floor(t*12)%2))bunny(bun.x,bun.y,"me",1,state==="win");
 for(const p of parts)circ(p.x,p.y,4,p.c);for(const x of texts)txt(x.s,x.x,x.y,x.big?32:24,x.c||"#fff");
 // "przejście" przy wejściu/wyjściu z norki: kółko zamyka się i otwiera wokół Szarusia
 let fa=0;for(const s of secs)if(s.k==="t")for(const B of[s.a,s.b])fa=Math.max(fa,1-Math.abs(bwx-B)/160);

let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);buttons=[];
 g.clearRect(-500,-500,VW+1000,VH+1000);
 if(state==="menu"){menu();}
 else{world();
  if(state==="play")hud();
  if(dist<300&&state==="play")txt(LEVELS[lvl].name,480,200,40,"#fff");
  if(state==="pause"){panel();txt("Pauza",480,170,50,"#8b5cf6");button("Graj dalej",360,220,240,70,"#22c55e",()=>{state="play";});button("Menu",360,320,240,70,"#3b82f6",()=>{state="menu";});}
  if(state==="over"){panel();txt("Ojej! Koniec żyć",480,170,46,"#ef4444");txt("Punkty: "+score,480,220,28,"#555");
   button("Jeszcze raz",360,260,240,70,"#22c55e",()=>startLevel(lvl));button("Menu",360,350,240,70,"#3b82f6",()=>{state="menu";});}
  if(state==="win"&&winT>2.2){panel();
   if(lvl===NL-1){txt("Szaruś jest w domu! 🏡",480,150,40,"#ff7a3d");txt("Cała rodzinka razem! Punkty: "+score,480,198,24,"#555");txt("Hurra! Wszystkie 10 poziomów!",480,236,22,"#22c55e");}
   else{txt("Brawo! Poziom "+(lvl+1)+" ukończony!",480,150,36,"#22c55e");txt("Punkty: "+score+"   Rekord: "+save.best[lvl],480,196,24,"#555");
    txt("Szaruś: „Cześć, "+FAMILY[lvl].v+"!”",480,234,24,"#ff5a8a");}
   if(lvl<NL-1)button("Dalej ▶",360,260,240,70,"#22c55e",()=>startLevel(lvl+1));else button("Od początku",360,260,240,70,"#22c55e",()=>startLevel(0));
   button("Menu",360,350,240,70,"#3b82f6",()=>{state="menu";});}}
 requestAnimationFrame(frame);}
build(0);
// haczyk testowy (nie przeszkadza w grze)
Object.assign(SZ,{start:startLevel,step:(sec)=>{for(let i=0;i<sec*60;i++)update(1/60);},
 get:()=>({state,lvl,dist:Math.round(dist),LEN,lives,score,belly,inside,poops:poops.length,y:Math.round(bun?bun.y:0),items:items.length}),
 set:(o)=>{if("dist"in o)dist=o.dist;if("lives"in o)lives=o.lives;if("belly"in o)belly=o.belly;}});
requestAnimationFrame(frame);
</script></body></html>
